[package]
name = "etet-preview"
version = "0.1.0"
description = "ETET Preview - local GGUF chat, zero persistence"
authors = ["rheoecho"]
edition = "2021"
default-run = "etet-preview"

[lib]
name = "etet_preview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
llama-sys = { path = "llama-sys" }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# sysinfo 不支持 iOS（libc 在 iOS target 下没导出 mach_task_self / proc_pidinfo 等），
# 所以 iOS 上直接不引入，commands.rs 里有对应的 cfg 分支。
[target.'cfg(not(target_os = "ios"))'.dependencies]
sysinfo = { version = "0.34", default-features = false, features = ["system"] }

# Android: resolve SAF content:// URIs to real files via JNI
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# iOS + Android: edge-to-edge full-screen (transparent system bars) so the
# CSS safe-area insets in app.css are the single source of truth for layout.
# No-op on desktop; registered only on mobile in lib.rs.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-edge-to-edge = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# smoke_test 是本地调试用的 bin，别让它跟着 cargo build 一起编译链接：
# 它在 macOS 上会因 -nodefaultlibs 缺 clang 的 __isPlatformVersionAtLeast 而失败。
# 本地要跑：cargo build --features smoke
[features]
smoke = []

[[bin]]
name = "smoke_test"
required-features = ["smoke"]