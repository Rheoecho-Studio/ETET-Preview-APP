name: Build ETET-Preview

# Cross-platform build: Windows / macOS (Apple Silicon) / Linux (AppImage) desktop
# plus Android / iOS mobile.
#
# llama.cpp is mounted as a git submodule (.gitmodules ->
# https://github.com/mirn0410/llama.cpp, master branch). Every job runs
# `git submodule update --init --depth 1` so CI does not have to
# pull the ~450MB full history. (No --recursive: llama.cpp has no nested
# submodules, and --recursive would wrongly clear its vulkan-shaders dir.)
#
# The GPU backend is chosen per platform in src-tauri/llama-sys/build.rs:
#   Windows / Linux / Android -> Vulkan (CPU-only builds are broken)
#   macOS -> Metal
#   iOS device -> Metal, built UNSIGNED (CODE_SIGNING_ALLOWED=NO) so users can
#                self-sign the .ipa with their own Apple ID — no dev account needed.
# Override with LLAMA_GPU_BACKEND=cpu|metal|vulkan|opencl if needed.
#
# Two host-side prerequisites for the Vulkan backend live outside build.rs:
#   Android: the NDK has no Vulkan-Hpp, so a version-matched Vulkan-Headers +
#            Vulkan-Hpp snapshot is staged under /opt (see the android job).
#   Windows: llama.cpp's nested CMake ExternalProject breaks the 260-char MAX_PATH
#            limit, so the CMake build tree is moved to a short root (see build.rs)
#            and long paths are enabled in the registry above.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  APP_NAME: ETET-Preview

jobs:
  # desktop
  desktop:
    permissions:
      contents: write
    concurrency:
      group: build-${{ github.ref }}-desktop-${{ matrix.platform }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: '' # bundle targets in tauri.conf.json are limited to appimage
          - platform: windows-latest
            args: '' # msi
          - platform: macos-latest
            args: '--target aarch64-apple-darwin' # Apple Silicon only -> dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # llama.cpp builds ggml-vulkan's shader generator through a nested CMake
      # ExternalProject, whose MSVC compiler probe writes under
      #   <build>/ggml/src/ggml-vulkan/vulkan-shaders-gen-prefix/src/
      #     vulkan-shaders-gen-build/CMakeFiles/CMakeScratch/TryCompile-XXXXXX/
      # Under the default OUT_DIR that path reaches ~258 characters, right at the legacy
      # 260-char MAX_PATH limit, and cl.exe fails it with
      #   "error C1083: Cannot open compiler generated file: ''"
      # -> "Check for working C compiler ... is broken"
      # -> "No CMAKE_CXX_COMPILER could be found".
      # Three cheap mitigations, all together:
      #   1. TEMP -> C:\T (build.rs also derives its short CMake root from TEMP)
      #   2. lift the MAX_PATH limit in the registry
      #   3. long paths for git's own checkout
      # build.rs does the real fix: it moves the whole CMake build tree out of OUT_DIR.
      - name: shorten temp and enable long paths (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\T | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=C:\T"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=C:\T"
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
          git config --system core.longpaths true
          Write-Host "TEMP -> C:\T, MAX_PATH limit lifted"

      - name: checkout llama.cpp submodule (shallow)
        shell: bash
        run: |
          git submodule sync --recursive
          # --depth 1, and deliberately NOT --recursive: llama.cpp has no real nested
          # submodules, and --recursive makes git treat ggml-vulkan/vulkan-shaders as an
          # empty submodule and wipe it, which then breaks every Vulkan build.
          git submodule update --init --depth 1
          echo "vulkan-shaders entries: $(ls -1 llama.cpp/ggml/src/ggml-vulkan/vulkan-shaders 2>/dev/null | wc -l)"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential cmake clang llvm-dev libclang-dev \
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
          patchelf xdg-utils libfuse2 \
          libvulkan-dev glslang-tools glslc \
          spirv-headers spirv-tools

      # Prebuilt LunarG SDK. Alternatives that did not work:
      #  - humbletim/setup-vulkan-sdk: uses actions/cache@v2 -> whole job fails at
      #    "Set up job" time
      #  - johnnynunez/setup-vulkan-sdk: builds Glslang from source and fails
      #    (ENABLE_OPT requires SPIRV-Tools)
      # llama.cpp needs glslangValidator + vulkan-1.lib at build time.

      # llama.cpp's ggml uses <filesystem>, which Apple's libc++ only exposes
      # from macOS 10.15 up. Without this, cc/cmake fall back to the Xcode SDK's
      # DefaultDeploymentTarget (10.13 on this image) and the build dies with
      # "'path' is unavailable: introduced in macOS 10.15".
      # 11.0 = first Apple Silicon macOS, and matches rustc's own default.
      # The macOS deployment target is handled in src-tauri/llama-sys/build.rs (it takes over
      # CMAKE_{C,CXX,ASM}_FLAGS entirely), so we do NOT export MACOSX_DEPLOYMENT_TARGET here:
      # the macOS runner image defaults it to 10.13 and an env export here can't reliably
      # override what the build-script process sees.

      - name: install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\VulkanSDK-1.4.363.0.exe"
          $maxRetries = 3
          $retryCount = 0
          $installed = $false

          while ($retryCount -lt $maxRetries -and -not $installed) {
            try {
              Write-Host "Downloading Vulkan SDK (attempt $($retryCount + 1))..."
              Invoke-WebRequest `
                -Uri "https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/vulkansdk-windows-X64-1.4.363.0.exe" `
                -OutFile $installer `
                -TimeoutSec 120

              Write-Host "Installing Vulkan SDK..."
              # NOTE: since LunarG 1.2.189.1 the installer switched to the Qt Installer
              # Framework; the old /S flag no longer works (it hangs forever), so the
              # Qt IFW flags below are required.
              $process = Start-Process -FilePath $installer `
                -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' `
                -PassThru
              if (-not $process.WaitForExit(900000)) {
                Write-Host "Installer timed out, killing it"
                $process.Kill()
                throw "Installer timed out after 900s"
              }

              if ($process.ExitCode -eq 0) {
                $installed = $true
                Write-Host "Installation successful"
              } else {
                throw "Installer exited with code $($process.ExitCode)"
              }
            } catch {
              Write-Host "Error: $_"
              $retryCount++
              Start-Sleep -Seconds 5
            }
          }

          if (-not $installed) {
            throw "Failed to install Vulkan SDK after $maxRetries attempts"
          }

          $sdk = "C:\VulkanSDK\1.4.363.0"
          Start-Sleep -Seconds 5

          if (-not (Test-Path "$sdk\Bin\glslangValidator.exe")) {
            throw "Vulkan SDK install failed: $sdk\Bin\glslangValidator.exe is missing"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$sdk"
          Add-Content -Path $env:GITHUB_PATH -Value "$sdk\Bin"

      # KyleMayes/install-llvm-action@v1 does not support win32 + LLVM 17.0.6
      # (fails with "Unsupported target!(platform='win32', version='17.0.6')"), so we
      # install the official LLVM package directly; LIBCLANG_PATH is consumed by bindgen.
      - name: install LLVM for bindgen (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\LLVM-17.0.6-win64.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/LLVM-17.0.6-win64.exe" `
            -OutFile $exe -TimeoutSec 600

          $process = Start-Process -FilePath $exe -ArgumentList '/S','/D=C:\LLVM' -PassThru
          if (-not $process.WaitForExit(600000)) {
            $process.Kill()
            throw "LLVM installer timed out"
          }
          if ($process.ExitCode -ne 0) { throw "LLVM installer exited with $($process.ExitCode)" }
          if (-not (Test-Path "C:\LLVM\bin\libclang.dll")) {
            throw "libclang.dll missing after LLVM install"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=C:\LLVM\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\LLVM\bin"

      # NOTE: do NOT downgrade CMake here. The image ships 4.4 and the runner's toolchain is
      # "Visual Studio 18 2026"; CMake 3.x only knows up to "Visual Studio 17 2022" and dies
      # with "Could not create named generator Visual Studio 18 2026". The vulkan-shaders
      # failure that looked like a CMake bug was actually the verbatim \\?\ path coming from
      # build.rs (see strip_verbatim there).
      # Pinned to the released action-v1.0.0
      # (commit 1deb371b0cd8bd54025b384f1cd735e725c4060f) instead of the floating
      # @v1 tag, so an upstream change cannot silently break CI.
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./src-tauri
          args: ${{ matrix.args }}
          # Build + upload the bundle as a workflow artifact only. The actual
          # GitHub Release (all 5 platforms, incl. the unsigned iOS IPA) is
          # published by the dedicated `release` job below, so tauri-action must
          # NOT create its own release here (otherwise the desktop and android
          # jobs race on the same tag). On a tag push the release is created on
          # the user's own tag (github.ref_name), not a tauri-generated one.
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: '[platform]-[arch]-[bundle]'
          retryAttempts: 2

  # android
  android:
    permissions:
      contents: write
    concurrency:
      group: build-${{ github.ref }}-android
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      ANDROID_TARGET: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4

      - name: checkout llama.cpp submodule (shallow)
        shell: bash
        run: |
          git submodule sync --recursive
          # --depth 1, and deliberately NOT --recursive: llama.cpp has no real nested
          # submodules, and --recursive makes git treat ggml-vulkan/vulkan-shaders as an
          # empty submodule and wipe it, which then breaks every Vulkan build.
          git submodule update --init --depth 1
          echo "vulkan-shaders entries: $(ls -1 llama.cpp/ggml/src/ggml-vulkan/vulkan-shaders 2>/dev/null | wc -l)"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: install Vulkan + build dependencies
        # ggml-vulkan compiles its shaders at build time with glslc; the Vulkan loader
        # (libvulkan.so) itself comes from the NDK sysroot at link time, and the device
        # supplies the real one at runtime.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang llvm-dev libclang-dev \
            libvulkan-dev glslang-tools glslc \
            spirv-headers spirv-tools

          # ggml-vulkan includes <vulkan/vulkan.hpp> (Vulkan-Hpp C++ bindings). The NDK sysroot
          # only ships the C header vulkan/vulkan.h, so the cross-compile dies with
          # "'vulkan/vulkan.hpp' file not found". Copying vulkan.hpp alone is not enough
          # either - it #includes vulkan_hpp_macros.hpp, vulkan_enums.hpp, ... - so stage a
          # complete, version-matched snapshot of BOTH repos:
          #
          #   /opt/vkh/vulkan/*.h          (Vulkan-Headers, Vulkan C headers)
          #   /opt/vkh/vk_video/*.h        (Vulkan-Headers, video codec headers -
          #                                 vulkan_core.h includes them unconditionally)
          #   /opt/vulkanhpp/vulkan/*.hpp  (Vulkan-Hpp, C++ bindings)
          #
          # The pair has to come from the same release: ggml-vulkan-types.h picks the
          # dispatcher namespace from VK_HEADER_VERSION (>= 301 -> vk::detail, below ->
          # vk), so mixing a new vulkan.hpp with the NDK's older vulkan.h takes the wrong
          # branch. Both dirs are isolated and only hold the vulkan/ subdirectory, so
          # nothing else on the include path can be shadowed.
          VULKAN_SNAPSHOT=v1.4.313
          sudo mkdir -p /opt/vkh /opt/vulkanhpp
          curl -sSL --retry 3 --fail --max-time 300 \
            "https://codeload.github.com/KhronosGroup/Vulkan-Headers/tar.gz/refs/tags/$VULKAN_SNAPSHOT" \
            | sudo tar -xz -C /opt/vkh --wildcards --strip-components=2 '*/include/*'
          curl -sSL --retry 3 --fail --max-time 300 \
            "https://codeload.github.com/KhronosGroup/Vulkan-Hpp/tar.gz/refs/tags/$VULKAN_SNAPSHOT" \
            | sudo tar -xz -C /opt/vulkanhpp --wildcards --strip-components=1 '*/vulkan'
          # ggml-vulkan-types.h also includes <spirv/unified1/spirv.hpp> (SPIRV-Headers).
          # The distro package puts it in /usr/include, but cross-compiling with --sysroot
          # hides /usr/include, so stage it the same way. Same SDK tag as above so the
          # Vulkan / SPIR-V headers stay in sync.
          sudo mkdir -p /opt/spirvh
          # NOTE: SPIRV-Headers tags its releases "vulkan-sdk-<ver>.0" while Vulkan-Headers /
          # Vulkan-Hpp use "v<ver>" - so strip the leading "v" before composing the tag.
          SPIRV_SNAPSHOT="vulkan-sdk-${VULKAN_SNAPSHOT#v}.0"
          echo "SPIRV-Headers snapshot: $SPIRV_SNAPSHOT"
          curl -sSL --retry 3 --fail --max-time 300 \
            "https://codeload.github.com/KhronosGroup/SPIRV-Headers/tar.gz/refs/tags/$SPIRV_SNAPSHOT" \
            | sudo tar -xz -C /opt/spirvh --wildcards --strip-components=2 '*/include/*'

          sudo chmod -R a+rX /opt/vkh /opt/vulkanhpp /opt/spirvh
          ls /opt/vkh/vulkan/vulkan.h \
             /opt/vkh/vk_video/vulkan_video_codec_av1std.h \
             /opt/vulkanhpp/vulkan/vulkan.hpp \
             /opt/vulkanhpp/vulkan/vulkan_hpp_macros.hpp \
             /opt/spirvh/spirv/unified1/spirv.hpp
          grep -m1 'define VK_HEADER_VERSION' /opt/vkh/vulkan/vulkan_core.h
          echo "VULKAN_HEADERS_INCLUDE=/opt/vkh" >> $GITHUB_ENV
          echo "VULKAN_HPP_INCLUDE=/opt/vulkanhpp" >> $GITHUB_ENV
          echo "SPIRV_HEADERS_INCLUDE=/opt/spirvh" >> $GITHUB_ENV

      # tauri-action does NOT create the Android Studio project, and it is not
      # committed either -> `tauri android build` aborted with
      # ".../src-tauri/gen/android doesn't exist. Please run `tauri android init`".
      - name: generate Android Studio project
        run: pnpm tauri android init

      - name: pin Android SDK levels
        run: |
          f=src-tauri/gen/android/app/build.gradle.kts
          if [ -f "$f" ]; then
            sed -i -E 's/([A-Za-z]*minSdk[A-Za-z]*[ =]+)[0-9]+/\1 30/; s/([A-Za-z]*targetSdk[A-Za-z]*[ =]+)[0-9]+/\1 37/; s/([A-Za-z]*compileSdk[A-Za-z]*[ =]+)[0-9]+/\1 37/' "$f"
          fi

      # `tauri android build` emits an APK *and* an .aab, and
      # uploadWorkflowArtifacts would ship both. Only the APK is wanted, so
      # automatic artifact upload is OFF: the APK is signed and uploaded
      # manually below, and the .aab is left on the runner.
      #
      # IMPORTANT: the generated gradle project has NO signing config, so gradle
      # only ever produces `app-universal-release-unsigned.apk`. The sibling
      # `app-universal-release.apk` is listed by tauri as a *candidate* but is
      # never actually created - pointing an upload step at it fails with
      # "No files were found with the provided path". Signing happens below.
      #
      # DO NOT invoke gradle directly (e.g. `./gradlew bundleRelease`) to build
      # an AAB here: gradle's rust plugin then re-runs `pnpm tauri android ...`
      # outside tauri's own invocation and the build dies with
      #   Execution failed for task ':app:rustBuildArm64Release'
      #   > Process 'command 'pnpm'' finished with non-zero exit value 1
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_PLATFORM: android-30
        with:
          projectPath: ./src-tauri
          mobile: android
          args: --target aarch64
          # signed APK is uploaded manually below; keeps the .aab out of the
          # artifacts (and therefore out of the GitHub Release).
          uploadWorkflowArtifacts: false
          retryAttempts: 2

      # Sign the release APK.
      # Preferred: a FIXED keystore supplied through repo secrets
      #   ANDROID_KEYSTORE_BASE64   (base64 of the .jks, single line)
      #   ANDROID_KEYSTORE_PASSWORD (store + key password)
      #   ANDROID_KEY_ALIAS         (default: etet)
      # A fixed key means every release shares one signature, so users can
      # upgrade in place instead of uninstalling first.
      # Fallback: generate a throwaway self-signed key on the runner, so the job
      # still works before the secrets are configured. A warning is logged --
      # each run then produces a DIFFERENT signature.
      # zipalign MUST run before apksigner or the v2/v3 signature is invalid.
      - name: sign Android APK
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK_IN=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          if [ ! -f "$APK_IN" ]; then
            echo "::error::unsigned APK not found at $APK_IN"
            find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' || true
            exit 1
          fi

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk=$SDK"
          # `|| true` so a missing build-tools dir falls through to the
          # diagnostic branch below instead of aborting under `set -e -o pipefail`
          BT=$(ls -1d "$SDK"/build-tools/*/ 2>/dev/null | sed 's:/$::' | sort -V | tail -1 || true)
          if [ -z "$BT" ] || [ ! -x "$BT/apksigner" ]; then
            echo "::error::apksigner not found under $SDK/build-tools"
            ls -1 "$SDK" 2>/dev/null || true
            ls -1 "$SDK/build-tools" 2>/dev/null || true
            exit 1
          fi
          echo "build-tools: $BT"

          KS="$RUNNER_TEMP/signing.jks"
          rm -f "$KS"
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_PASS:-}" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            KPASS="$KS_PASS"
            ALIAS="${KS_ALIAS:-etet}"
            echo "signing with the fixed keystore from repo secrets (alias=$ALIAS)"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD not set - generating a throwaway key. Each run gets a DIFFERENT signature and users cannot upgrade in place."
            KPASS="android"
            ALIAS="etet"
            keytool -genkeypair -v \
              -keystore "$KS" -storetype JKS -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KPASS" -keypass "$KPASS" \
              -dname "CN=ETET-Preview, OU=RheoEcho, O=RheoEcho, L=Unknown, S=Unknown, C=CN"
          fi

          ALIGNED="$RUNNER_TEMP/app-universal-release-aligned.apk"
          OUT="$RUNNER_TEMP/app-universal-release.apk"
          "$BT/zipalign" -f -p 4 "$APK_IN" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KPASS" --key-pass "pass:$KPASS" \
            --out "$OUT" "$ALIGNED"
          # fail loudly if the result is not a properly signed APK
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "apk=$OUT" >> "$GITHUB_ENV"
          echo "signed apk: $OUT ($(du -h "$OUT" | cut -f1))"

      # Upload ONLY the signed APK (no AAB).
      - name: upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-universal-apk
          path: ${{ env.apk }}
          if-no-files-found: error

  # ios
  ios:
    permissions:
      contents: write
      actions: write
    concurrency:
      group: build-${{ github.ref }}-ios
      cancel-in-progress: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: checkout llama.cpp submodule (shallow)
        shell: bash
        run: |
          git submodule sync --recursive
          # --depth 1, and deliberately NOT --recursive: llama.cpp has no real nested
          # submodules, and --recursive makes git treat ggml-vulkan/vulkan-shaders as an
          # empty submodule and wipe it, which then breaks every Vulkan build.
          git submodule update --init --depth 1
          echo "vulkan-shaders entries: $(ls -1 llama.cpp/ggml/src/ggml-vulkan/vulkan-shaders 2>/dev/null | wc -l)"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Same story as Android: the Xcode project under src-tauri/gen/apple is
      # missing, so `tauri ios build` aborted immediately. Generate it here.
      - name: generate Xcode project
        run: pnpm tauri ios init

      # No Apple developer account here, so the app has to be built unsigned. Passing
      # CODE_SIGNING_ALLOWED=NO through tauri's `args` does NOT work: tauri keeps it for
      # itself and never forwards it to xcodebuild (the log shows xcodebuild invoked with
      # only "-allowProvisioningUpdates ... build"), so the build still dies with
      # 'Signing for "etet-preview_iOS" requires a development team'. Flip the signing
      # settings directly in the generated project.pbxproj instead.
      - name: disable code signing in Xcode project
        shell: bash
        run: |
          PB=src-tauri/gen/apple/etet-preview.xcodeproj/project.pbxproj
          if [ ! -f "$PB" ]; then
            echo "::error::project.pbxproj not found at $PB"
            exit 1
          fi
          python3 - "$PB" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          # drop any existing signing-related build settings
          s = re.sub(r'\n\s*(CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER)\s*=\s*.*?;', '', s)
          # inject unsigned settings into every buildSettings block
          s = re.sub(r'(buildSettings = \{\n)',
              r'\1\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "";\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tDEVELOPMENT_TEAM = "";\n',
              s)
          open(p, 'w').write(s)
          print("patched", p)
          PY

      # Build the device arch (Metal backend) unsigned; the .app is then zipped into an
      # unsigned .ipa below (an IPA is just a Payload/ directory). Users download it and
      # self-sign with their own Apple ID. No dev account, no secrets required.
      # Xcode compiles and links the device .app fine, but tauri's final `-exportArchive` step
      # insists on a teamID ("teamID should be non-empty"), which we do not have without a paid
      # account. The .app is already on disk at that point, so tolerate the export failure and
      # package the .app ourselves below.
      - uses: tauri-apps/tauri-action@action-v1.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IOS_MIN_VERSION: '14.0'
        with:
          projectPath: ./src-tauri
          mobile: ios
          # device arch (not -sim; simulator binaries cannot run on a device).
          # Signing is already off via the patched Xcode project above.
          args: --target aarch64
          # We package the unsigned IPA ourselves and upload it as a workflow
          # artifact (ios-aarch64-device-ipa); the dedicated `release` job then
          # attaches it to the GitHub Release on the user's tag.
          uploadWorkflowArtifacts: false
          workflowArtifactNamePattern: '[platform]-[arch]-[bundle]'
          retryAttempts: 2

      # Manually package the unsigned device .app into an unsigned .ipa (a zip of
      # Payload/<app>.app). Users download it and self-sign with their own Apple ID
      # (e.g. 爱思/AltStore) to install on a device — no dev account needed.
      - name: package unsigned device IPA
        if: always()
        shell: bash
        run: |
          # Xcode puts the built .app in DerivedData (.../Build/Products/release-iphoneos/).
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 6 -path '*release-iphoneos*' -name '*.app' 2>/dev/null | head -n1)
          if [ -z "$APP" ]; then
            APP=$(find src-tauri/target/aarch64-apple-ios/release/bundle/ios src-tauri/gen/apple/build -name '*.app' 2>/dev/null | head -n1)
          fi
          if [ -z "$APP" ]; then
            echo "::error::no device .app produced by tauri ios build"
            exit 1
          fi
          echo "packing unsigned device ipa from $APP"
          OUT="$RUNNER_TEMP/ios-unsigned.ipa"
          rm -f "$OUT"
          TD=$(mktemp -d)
          mkdir -p "$TD/Payload"
          cp -r "$APP" "$TD/Payload/"
          ( cd "$TD" && zip -r "$OUT" Payload )
          echo "wrote $OUT ($(du -h "$OUT" | cut -f1))"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-aarch64-device-ipa
          path: ${{ runner.temp }}/ios-unsigned.ipa

  # After every platform is green on a push to main, derive the version from
  # tauri.conf.json, push an ANNOTATED `vX.Y.Z` tag, and publish a GitHub
  # Release at that tag (title = the version, body = the notes below) carrying
  # all 5 bundles incl. the unsigned iOS IPA that users self-sign. A Release is
  # required to attach binaries — a plain tag only ships the auto-generated
  # source tarball. Runs only on push; `on.push` no longer matches tags, so the
  # pushed tag does not re-trigger a build.
  release:
    name: publish release + tag
    needs: [desktop, android, ios]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: read version from tauri.conf.json
        id: ver
        shell: bash
        run: |
          V=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "version: $V  tag: v$V"

      - name: download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: list downloaded artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - name: build release notes
        id: notes
        shell: bash
        run: |
          # First line of the commit that triggered this run.
          MSG=$(git log -1 --pretty=%B | head -1)
          {
            echo "# ETET–Preview–APP"
            echo " This application currently does not have the production capacity."
            echo "> v${{ steps.ver.outputs.version }}: $MSG"
            echo "RheoEcho 2026"
          } > "$RUNNER_TEMP/release-notes.md"
          echo "---- release notes ----"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: push annotated version tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists, skipping push"
          else
            git tag -a "$TAG" -F "$RUNNER_TEMP/release-notes.md"
            git push origin "$TAG"
            echo "pushed annotated tag $TAG"
          fi

      - name: publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: artifacts/**
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
