name: Build ETET-Preview

# Cross-platform build: Windows / macOS (Apple Silicon) / Linux (AppImage) desktop
# plus Android / iOS mobile.
#
# llama.cpp is mounted as a git submodule (.gitmodules ->
# https://github.com/mirn0410/llama.cpp, master branch). Every job runs
# `git submodule update --init --depth 1` so CI does not have to
# pull the ~450MB full history. (No --recursive: llama.cpp has no nested
# submodules, and --recursive would wrongly clear its vulkan-shaders dir.)
#
# The GPU backend is chosen per platform in src-tauri/llama-sys/build.rs:
#   Windows / Linux / Android -> Vulkan (CPU-only builds are broken)
#   macOS -> Metal
#   iOS device -> Metal, built UNSIGNED (CODE_SIGNING_ALLOWED=NO) so users can
#                self-sign the .ipa with their own Apple ID — no dev account needed.
# Override with LLAMA_GPU_BACKEND=cpu|metal|vulkan|opencl if needed.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  APP_NAME: ETET-Preview

jobs:
  # desktop
  desktop:
    permissions:
      contents: write
    concurrency:
      group: build-${{ github.ref }}-desktop-${{ matrix.platform }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: '' # bundle targets in tauri.conf.json are limited to appimage
          - platform: windows-latest
            args: '' # msi
          - platform: macos-latest
            args: '--target aarch64-apple-darwin' # Apple Silicon only -> dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: checkout llama.cpp submodule (shallow)
        shell: bash
        run: |
          git submodule sync --recursive
          # Only fetch the top-level llama.cpp (--depth 1). Do NOT use --recursive!
          # At commit 34688f3, vulkan-shaders is already a plain directory (llama.cpp
          # has no .gitmodules of its own). Once --recursive descends into llama.cpp and
          # reads its "leftover nested-submodule config", git treats vulkan-shaders as an
          # empty submodule and clears it, so Windows (Vulkan=ON) fails with
          # "No download info given for 'vulkan-shaders-gen'". llama.cpp has no real nested
          # submodules, so --init alone is enough; without --recursive, vulkan-shaders lands
          # as a plain directory.
          git submodule update --init --depth 1
          D=llama.cpp/ggml/src/ggml-vulkan/vulkan-shaders
          # vulkan-shaders is a plain dir at 34688f3 (llama.cpp has no .gitmodules), but on
          # Windows `git submodule update` sometimes does not populate it into the worktree,
          # leaving it empty and making ggml-vulkan fail with
          # "No download info given for 'vulkan-shaders-gen'".
          # Extract its contents straight from the commit tree with git archive: cross-platform
          # and needs no network since llama.cpp is already cloned.
          if [ ! -f "$D/vulkan-shaders-gen.cpp" ]; then
            rm -rf "$D"
            git -C llama.cpp archive HEAD ggml/src/ggml-vulkan/vulkan-shaders \
              | tar -x --strip-components=3 -C "$D/.." 2>/dev/null || true
          fi
          # Fallback: if git archive also fails (rare), overwrite from an upstream sparse clone.
          if [ ! -f "$D/vulkan-shaders-gen.cpp" ]; then
            T=$(mktemp -d)
            git clone --filter=blob:none --no-checkout https://github.com/mirn0410/llama.cpp "$T"
            git -C "$T" fetch origin 34688f3dc1daf4cba0a4a6e97597ee1f88d79487
            git -C "$T" checkout 34688f3dc1daf4cba0a4a6e97597ee1f88d79487 -- ggml/src/ggml-vulkan/vulkan-shaders
            rm -rf "$D"; mkdir -p "$D"
            cp -rf "$T/ggml/src/ggml-vulkan/vulkan-shaders/." "$D/"
            rm -rf "$T"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential cmake clang llvm-dev libclang-dev \
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
          patchelf xdg-utils libfuse2 \
          libvulkan-dev glslang-tools glslc \
          spirv-headers spirv-tools

      # Prebuilt LunarG SDK. Alternatives that did not work:
      #  - humbletim/setup-vulkan-sdk: uses actions/cache@v2 -> whole job fails at
      #    "Set up job" time
      #  - johnnynunez/setup-vulkan-sdk: builds Glslang from source and fails
      #    (ENABLE_OPT requires SPIRV-Tools)
      # llama.cpp needs glslangValidator + vulkan-1.lib at build time.

      # llama.cpp's ggml uses <filesystem>, which Apple's libc++ only exposes
      # from macOS 10.15 up. Without this, cc/cmake fall back to the Xcode SDK's
      # DefaultDeploymentTarget (10.13 on this image) and the build dies with
      # "'path' is unavailable: introduced in macOS 10.15".
      # 11.0 = first Apple Silicon macOS, and matches rustc's own default.
      # The macOS deployment target is handled in src-tauri/llama-sys/build.rs (it takes over
      # CMAKE_{C,CXX,ASM}_FLAGS entirely), so we do NOT export MACOSX_DEPLOYMENT_TARGET here:
      # the macOS runner image defaults it to 10.13 and an env export here can't reliably
      # override what the build-script process sees.

      - name: install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\VulkanSDK-1.4.363.0.exe"
          $maxRetries = 3
          $retryCount = 0
          $installed = $false

          while ($retryCount -lt $maxRetries -and -not $installed) {
            try {
              Write-Host "Downloading Vulkan SDK (attempt $($retryCount + 1))..."
              Invoke-WebRequest `
                -Uri "https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/vulkansdk-windows-X64-1.4.363.0.exe" `
                -OutFile $installer `
                -TimeoutSec 120

              Write-Host "Installing Vulkan SDK..."
              # NOTE: since LunarG 1.2.189.1 the installer switched to the Qt Installer
              # Framework; the old /S flag no longer works (it hangs forever), so the
              # Qt IFW flags below are required.
              $process = Start-Process -FilePath $installer `
                -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' `
                -PassThru
              if (-not $process.WaitForExit(900000)) {
                Write-Host "Installer timed out, killing it"
                $process.Kill()
                throw "Installer timed out after 900s"
              }

              if ($process.ExitCode -eq 0) {
                $installed = $true
                Write-Host "Installation successful"
              } else {
                throw "Installer exited with code $($process.ExitCode)"
              }
            } catch {
              Write-Host "Error: $_"
              $retryCount++
              Start-Sleep -Seconds 5
            }
          }

          if (-not $installed) {
            throw "Failed to install Vulkan SDK after $maxRetries attempts"
          }

          $sdk = "C:\VulkanSDK\1.4.363.0"
          Start-Sleep -Seconds 5

          if (-not (Test-Path "$sdk\Bin\glslangValidator.exe")) {
            throw "Vulkan SDK install failed: $sdk\Bin\glslangValidator.exe is missing"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$sdk"
          Add-Content -Path $env:GITHUB_PATH -Value "$sdk\Bin"

      # KyleMayes/install-llvm-action@v1 does not support win32 + LLVM 17.0.6
      # (fails with "Unsupported target!(platform='win32', version='17.0.6')"), so we
      # install the official LLVM package directly; LIBCLANG_PATH is consumed by bindgen.
      - name: install LLVM for bindgen (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\LLVM-17.0.6-win64.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/LLVM-17.0.6-win64.exe" `
            -OutFile $exe -TimeoutSec 600

          $process = Start-Process -FilePath $exe -ArgumentList '/S','/D=C:\LLVM' -PassThru
          if (-not $process.WaitForExit(600000)) {
            $process.Kill()
            throw "LLVM installer timed out"
          }
          if ($process.ExitCode -ne 0) { throw "LLVM installer exited with $($process.ExitCode)" }
          if (-not (Test-Path "C:\LLVM\bin\libclang.dll")) {
            throw "libclang.dll missing after LLVM install"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=C:\LLVM\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\LLVM\bin"

      # Pinned to the released action-v1.0.0
      # (commit 1deb371b0cd8bd54025b384f1cd735e725c4060f) instead of the floating
      # @v1 tag, so an upstream change cannot silently break CI.
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./src-tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: '[platform]-[arch]-[bundle]'
          retryAttempts: 2
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'ETET-Preview-v__VERSION__' || '' }}
          releaseName: 'ETET-Preview v__VERSION__'
          releaseBody: 'Windows (msi), macOS (dmg, Apple Silicon) and Linux (AppImage) builds.'
          releaseDraft: true
          prerelease: false

  # android
  android:
    permissions:
      contents: write
    concurrency:
      group: build-${{ github.ref }}-android
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      ANDROID_TARGET: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4

      - name: checkout llama.cpp submodule (shallow)
        shell: bash
        run: |
          git submodule sync --recursive
          # Only fetch the top-level llama.cpp (--depth 1). Do NOT use --recursive!
          # At commit 34688f3, vulkan-shaders is already a plain directory (llama.cpp
          # has no .gitmodules of its own). Once --recursive descends into llama.cpp and
          # reads its "leftover nested-submodule config", git treats vulkan-shaders as an
          # empty submodule and clears it, so Windows (Vulkan=ON) fails with
          # "No download info given for 'vulkan-shaders-gen'". llama.cpp has no real nested
          # submodules, so --init alone is enough; without --recursive, vulkan-shaders lands
          # as a plain directory.
          git submodule update --init --depth 1
          D=llama.cpp/ggml/src/ggml-vulkan/vulkan-shaders
          # vulkan-shaders is a plain dir at 34688f3 (llama.cpp has no .gitmodules), but on
          # Windows `git submodule update` sometimes does not populate it into the worktree,
          # leaving it empty and making ggml-vulkan fail with
          # "No download info given for 'vulkan-shaders-gen'".
          # Extract its contents straight from the commit tree with git archive: cross-platform
          # and needs no network since llama.cpp is already cloned.
          if [ ! -f "$D/vulkan-shaders-gen.cpp" ]; then
            rm -rf "$D"
            git -C llama.cpp archive HEAD ggml/src/ggml-vulkan/vulkan-shaders \
              | tar -x --strip-components=3 -C "$D/.." 2>/dev/null || true
          fi
          # Fallback: if git archive also fails (rare), overwrite from an upstream sparse clone.
          if [ ! -f "$D/vulkan-shaders-gen.cpp" ]; then
            T=$(mktemp -d)
            git clone --filter=blob:none --no-checkout https://github.com/mirn0410/llama.cpp "$T"
            git -C "$T" fetch origin 34688f3dc1daf4cba0a4a6e97597ee1f88d79487
            git -C "$T" checkout 34688f3dc1daf4cba0a4a6e97597ee1f88d79487 -- ggml/src/ggml-vulkan/vulkan-shaders
            rm -rf "$D"; mkdir -p "$D"
            cp -rf "$T/ggml/src/ggml-vulkan/vulkan-shaders/." "$D/"
            rm -rf "$T"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: install Vulkan + build dependencies
        # ggml-vulkan compiles its shaders at build time with glslc and needs
        # SPIRV-Headers; the Vulkan loader (libvulkan.so) itself comes from the
        # NDK sysroot at link time, and the device supplies the real one at runtime.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang llvm-dev libclang-dev \
            libvulkan-dev glslang-tools glslc \
            spirv-headers spirv-tools

      # tauri-action does NOT create the Android Studio project, and it is not
      # committed either -> `tauri android build` aborted with
      # ".../src-tauri/gen/android doesn't exist. Please run `tauri android init`".
      - name: generate Android Studio project
        run: pnpm tauri android init

      - name: pin Android SDK levels
        run: |
          f=src-tauri/gen/android/app/build.gradle.kts
          if [ -f "$f" ]; then
            sed -i -E 's/([A-Za-z]*minSdk[A-Za-z]*[ =]+)[0-9]+/\1 30/; s/([A-Za-z]*targetSdk[A-Za-z]*[ =]+)[0-9]+/\1 37/; s/([A-Za-z]*compileSdk[A-Za-z]*[ =]+)[0-9]+/\1 37/' "$f"
          fi

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_PLATFORM: android-30
        with:
          projectPath: ./src-tauri
          mobile: android
          args: --target aarch64
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: '[platform]-[arch]-[bundle]'
          retryAttempts: 2
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'ETET-Preview-v__VERSION__' || '' }}
          releaseName: 'ETET-Preview v__VERSION__'
          releaseBody: 'ETET-Preview v__VERSION__ build artifacts.'
          releaseDraft: true
          prerelease: false

  # ios
  ios:
    permissions:
      contents: write
      actions: write
    concurrency:
      group: build-${{ github.ref }}-ios
      cancel-in-progress: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: checkout llama.cpp submodule (shallow)
        shell: bash
        run: |
          git submodule sync --recursive
          # Only fetch the top-level llama.cpp (--depth 1). Do NOT use --recursive!
          # At commit 34688f3, vulkan-shaders is already a plain directory (llama.cpp
          # has no .gitmodules of its own). Once --recursive descends into llama.cpp and
          # reads its "leftover nested-submodule config", git treats vulkan-shaders as an
          # empty submodule and clears it, so Windows (Vulkan=ON) fails with
          # "No download info given for 'vulkan-shaders-gen'". llama.cpp has no real nested
          # submodules, so --init alone is enough; without --recursive, vulkan-shaders lands
          # as a plain directory.
          git submodule update --init --depth 1
          D=llama.cpp/ggml/src/ggml-vulkan/vulkan-shaders
          # vulkan-shaders is a plain dir at 34688f3 (llama.cpp has no .gitmodules), but on
          # Windows `git submodule update` sometimes does not populate it into the worktree,
          # leaving it empty and making ggml-vulkan fail with
          # "No download info given for 'vulkan-shaders-gen'".
          # Extract its contents straight from the commit tree with git archive: cross-platform
          # and needs no network since llama.cpp is already cloned.
          if [ ! -f "$D/vulkan-shaders-gen.cpp" ]; then
            rm -rf "$D"
            git -C llama.cpp archive HEAD ggml/src/ggml-vulkan/vulkan-shaders \
              | tar -x --strip-components=3 -C "$D/.." 2>/dev/null || true
          fi
          # Fallback: if git archive also fails (rare), overwrite from an upstream sparse clone.
          if [ ! -f "$D/vulkan-shaders-gen.cpp" ]; then
            T=$(mktemp -d)
            git clone --filter=blob:none --no-checkout https://github.com/mirn0410/llama.cpp "$T"
            git -C "$T" fetch origin 34688f3dc1daf4cba0a4a6e97597ee1f88d79487
            git -C "$T" checkout 34688f3dc1daf4cba0a4a6e97597ee1f88d79487 -- ggml/src/ggml-vulkan/vulkan-shaders
            rm -rf "$D"; mkdir -p "$D"
            cp -rf "$T/ggml/src/ggml-vulkan/vulkan-shaders/." "$D/"
            rm -rf "$T"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Same story as Android: the Xcode project under src-tauri/gen/apple is
      # missing, so `tauri ios build` aborted immediately. Generate it here.
      - name: generate Xcode project
        run: pnpm tauri ios init

      # No Apple developer account needed: build the device arch (Metal backend) but disable
      # Xcode signing (CODE_SIGNING_ALLOWED=NO) to produce an UNSIGNED .app. Below we manually
      # zip it into an unsigned .ipa (an IPA is just a Payload/ directory). Users download it
      # and self-sign with their own Apple ID. No dev account, no secrets required.

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IOS_MIN_VERSION: '14.0'
        with:
          projectPath: ./src-tauri
          mobile: ios
          # --target aarch64  = device arch (not -sim; simulator binaries can't run on a device)
          # -- CODE_SIGNING_ALLOWED=NO = disable Xcode signing, produce unsigned .app
          args: --target aarch64 -- CODE_SIGNING_ALLOWED=NO
          # We package the unsigned IPA ourselves, so disable tauri-action's upload
          uploadWorkflowArtifacts: false
          workflowArtifactNamePattern: '[platform]-[arch]-[bundle]'
          retryAttempts: 2
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'ETET-Preview-v__VERSION__' || '' }}
          releaseName: 'ETET-Preview v__VERSION__'
          releaseBody: 'ETET-Preview v__VERSION__ build artifacts.'
          releaseDraft: true
          prerelease: false

      # Manually package the unsigned device .app into an unsigned .ipa (a zip of Payload/<app>.app).
      # Users download it and self-sign with their own Apple ID to install on a device.
      - name: package unsigned device IPA
        if: success()
        shell: bash
        run: |
          APP=$(find src-tauri/target/aarch64-apple-ios/release/bundle/ios -name '*.app' 2>/dev/null | head -n1)
          if [ -z "$APP" ]; then
            APP=$(find src-tauri/gen/apple/build -name '*.app' -maxdepth 4 2>/dev/null | head -n1)
          fi
          if [ -z "$APP" ]; then
            echo "::error::no device .app produced by tauri ios build"
            exit 1
          fi
          echo "packing unsigned device ipa from $APP"
          OUT="$RUNNER_TEMP/ios-unsigned.ipa"
          rm -f "$OUT"
          TD=$(mktemp -d)
          mkdir -p "$TD/Payload"
          cp -r "$APP" "$TD/Payload/"
          ( cd "$TD" && zip -r "$OUT" Payload )
          echo "wrote $OUT ($(du -h "$OUT" | cut -f1))"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-aarch64-device-ipa
          path: ${{ runner.temp }}/ios-unsigned.ipa
